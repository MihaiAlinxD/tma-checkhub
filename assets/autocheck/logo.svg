<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
<title id="title">AutoCheck — Garajul tău inteligent</title>
<desc id="desc">Logo AutoCheck cu mașină văzută din față, ramă albastru-violet și slogan.</desc>
<defs>
 <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#506af7"/><stop offset="1" stop-color="#a341df"/></linearGradient>
 <linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#80dfff"/><stop offset="1" stop-color="#73aaff"/></linearGradient>
</defs>
<rect x="30" y="49" width="218" height="218" rx="61" fill="none" stroke="url(#frame)" stroke-width="14"/>
<g fill="none" stroke="url(#car)" stroke-linecap="round" stroke-linejoin="round">
 <!-- Low rounded roof and wide windshield, matching the supplied original car -->
 <path d="M84 168 101 126 Q107 109 125 109 H156 Q174 109 181 126 L198 168" stroke-width="13"/>
 <!-- Rounded bumper and integrated body -->
 <path d="M83 162 H195 Q209 162 211 183 V207 Q211 220 198 220 H81 Q68 220 68 207 V184 Q68 162 83 162 Z" stroke-width="13"/>
 <!-- Original's short wheels below the body -->
 <path d="M88 220 V230 Q88 239 98 239 H107 Q117 239 117 230 V221 M163 221 V230 Q163 239 173 239 H183 Q193 239 193 230 V220" stroke-width="12"/>
 <!-- Headlights are outlined rounded capsules rather than straight strokes -->
 <rect x="85" y="186" width="35" height="17" rx="8.5" stroke-width="9"/>
 <rect x="159" y="186" width="35" height="17" rx="8.5" stroke-width="9"/>
</g>
<text x="290" y="157" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="99" font-weight="800" letter-spacing="-4">AutoCheck</text>
<text x="294" y="219" fill="#c3c6e5" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="700" letter-spacing="-1.3">Garajul tău inteligent</text>
</svg>